<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookbook 3.0 Registration</title>
  <link rel="icon" type="image/png" href="./logo.png">
  <link rel="stylesheet" href="./styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

  <!-- Background Layer -->
  <div id="stars"></div>

  <!-- Black Hole Layer (Background) -->
  <div class="black-hole-container">
    <div class="accretion-disk"></div>
    <div class="photon-ring"></div>
    <div class="event-horizon"></div>
  </div>

  <!-- Form Layer -->
  <div class="form-container">
    <!-- Logo moved inside container for better mobile layout -->
    <a href="https://codechef-wce-chapter.org">
      <img src="logo.png" alt="Cookbook Logo" class="form-logo" onerror="this.style.display='none'">
    </a>
    
    <h1>COOKBOOK 3.0</h1>
    <p class="subtitle"><b>CodeChef WCE Chapter</b></p>

    <form
      id="regForm"
      action="https://script.google.com/macros/s/AKfycbzwX1adKzkOzbAE8Ju11uFQADc4QKSgRy9c1HrfJmpUouaCvKaAUVJ2mvkFTY-z-wyY/exec"
      method="POST">
      
      <div class="input-group">
        <label>FULL NAME</label>
        <input name="name" type="text" placeholder="ex. Chaitanya Patil" required autocomplete="off">
      </div>
      
      <div class="input-group">
        <label>EMAIL ADDRESS</label>
        <input type="email" name="email" placeholder="ex. chaitanya.patil@walchandsangli.ac.in" required autocomplete="off">
      </div>
      
      <div class="input-group">
        <label>PHONE NUMBER</label>
        <input type="tel" name="phone" placeholder="ex. 9876543210" required autocomplete="off">
      </div>
      
      <div class="input-group">
        <label>BRANCH</label>
        <select name="branch" required>
          <option value="" disabled selected>Select your branch</option>
          <option value="CSE">CSE</option>
          <option value="IT">IT</option>
          <option value="AI-ML">AI-ML</option>
          <option value="TRONICS">TRONICS</option>
          <option value="ROBO">ROBO</option>
          <option value="MECH">MECH</option>
          <option value="CIVIL">CIVIL</option>
          <option value="TRICAL">TRICAL</option>
        </select>
      </div>
      
      <div class="input-group">
        <label>YEAR</label>
        <select name="year" required>
          <option value="" disabled selected>Select your year</option>
          <option value="FY">First Year (FY)</option>
          <option value="SY">Second Year (SY)</option>
          <option value="TY">Third Year (TY)</option>
          <option value="LY">Final Year (LY)</option>
        </select>
      </div>
      <!-- Terms Checkbox -->
<div class="checkbox-container">
  <input type="checkbox" id="terms" name="terms_agreed" required>
  <label for="terms">I hereby confirm that I will remain present for all the sessions conducted.</label>
</div>

      <button type="submit">REGISTER NOW</button>
    </form>
<!-- Contact Note -->
<p class="note-text">
  <b>Note:</b> In case you are unable to attend after registration, please 
  <a href="mailto:wcecodechefchapter@gmail.com?subject=Attendance%20Update%20Cookbook%203.0">contact us</a>.
</p>

  </div>

  <!-- Footer -->
  <div class="footer">
    &copy; 2026 CodeChef WCE Chapter. All rights reserved.
  </div>

  <!-- Popup Notification -->
  <div id="popupMessage">Registration Successful!</div>

  <script src="./script.js"></script>
</body>
</html>
