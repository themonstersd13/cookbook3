<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookbook 3.0 Registration</title>
  <link rel="icon" type="image/png" href="./logo.png">
  <link rel="stylesheet" href="./styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

  <!-- Background Layer -->
  <div id="stars"></div>

  <!-- Black Hole Layer (Background) -->
  <div class="black-hole-container">
    <div class="accretion-disk"></div>
    <div class="photon-ring"></div>
    <div class="event-horizon"></div>
  </div>

  <!-- Form Layer -->
  <div class="form-container">
    <!-- Logo moved inside container for better mobile layout -->
    <a href="https://codechef-wce-chapter.org">
      <img src="logo.png" alt="Cookbook Logo" class="form-logo" onerror="this.style.display='none'">
    </a>
    
    <h1>COOKBOOK 3.0</h1>
    <p class="subtitle"><b>CodeChef WCE Chapter</b></p>

    <div class="closed-message" style="text-align: center; padding: 40px 20px;">
      <h2 style="font-family: 'Orbitron', sans-serif; color: #ff4757; font-size: 1.8rem; margin-bottom: 20px; text-shadow: 0 0 10px rgba(255, 71, 87, 0.4);">REGISTRATIONS CLOSED</h2>
      <p style="font-size: 1.1rem; line-height: 1.8; color: #ced6e0;">
        Oops! Looks like you're a bit late.<br>
        <b>Bad luck!</b> The portal has been closed.<br>
        <br>
        We hope to see you next year! 👋
      </p>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    &copy; 2026 CodeChef WCE Chapter. All rights reserved.
  </div>

  <!-- Popup Notification -->
  <div id="popupMessage">Registration Successful!</div>

  <script src="./script.js"></script>
</body>
</html>
